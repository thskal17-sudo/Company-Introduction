# data/company.yaml, templates/, generate.py 가 바뀌어 push 되면
# 소개서(HTML/PDF/DOCX)를 자동으로 다시 만들어 output/ 에 커밋하고, 다운로드용 artifact 로도 올립니다.
name: 회사 소개서 자동 생성

on:
  push:
    paths:
      - "data/**"
      - "templates/**"
      - "assets/**"
      - "generate.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치 (파이썬 패키지 + 한글 폰트)
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null

      - name: 소개서 생성
        run: python generate.py --all

      - name: 결과물 artifact 업로드
        uses: actions/upload-artifact@v4
        with:
          name: company-introduction
          path: output/

      - name: 결과물 저장소에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: 회사 소개서 자동 재생성 [skip ci]"
            git push
          fi
