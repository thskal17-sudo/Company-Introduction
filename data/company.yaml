  text: |
    안녕하십니까, 한국엑스퍼트교육원입니다.

    2025년을 지나며 생성형 AI는 단순한 '학습 도구'가 아니라 모든 산업의 표준 도구가 되었습니다.
    중요한 것은 AI 기술을 배우는 것 자체가 아니라, 실제 현장에서 이를 어떻게 성과로 연결하느냐입니다.

    저희는 현장의 경험을 살려 학생들의 취업 역량을 높이는 실무 프로그램을 제공합니다.
    학생들이 자신의 진로에 자신감을 갖고 현장에서 환영받는 인재로 성장하도록 돕는
