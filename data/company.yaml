# 교육 프로그램 / 서비스
programs:
  - title: "리더십 & 조직관리"
    summary: "팀장·임원급을 위한 실전 리더십 과정"
    target: "신임 팀장, 중간관리자, 임원"
    duration: "8시간 (1일) ~ 16시간 (2일)"
    features:
      - "성과 코칭 대화법과 피드백 실습"
      - "세대 간 소통과 갈등 관리"
      - "교육 후 1:1 코칭 세션 제공"
  - title: "비즈니스 커뮤니케이션"
    summary: "보고·회의·프레젠테이션 역량 강화"
    target: "전 직급"
    duration: "8시간"
    features:
      - "한 장 보고서 작성법"
      - "설득력 있는 프레젠테이션 실습"
      - "실제 업무 자료로 진행하는 워크숍"
  - title: "강사 양성 과정 (TTT)"
    summary: "사내 강사와 전문 강사를 위한 교수법 과정"
    target: "사내 강사, 예비 전문 강사"
    duration: "24시간 (3일)"
    features:
      - "교안 설계와 커리큘럼 개발"
      - "강의 시연과 전문가 피드백"
      - "수료 후 강사 네트워크 지원"

