# 회사 소개 (2~4문단 권장)
about: |
  샘플교육컴퍼니는 2018년 설립 이래 기업과 기관을 대상으로 실무 중심의 교육 프로그램을
  제공해 온 교육 전문 기업입니다. 현장에서 바로 활용할 수 있는 커리큘럼과 검증된 강사진을
  바탕으로 지금까지 300여 개 기업, 2만 명 이상의 수강생과 함께했습니다.

  우리는 교육이 단순한 지식 전달이 아니라 개인과 조직의 실질적인 변화를 만드는 과정이라고
  믿습니다. 고객사의 상황을 깊이 이해하고, 목표에 맞는 맞춤형 과정을 설계합니다.

mission: "실무에서 통하는 교육으로 사람과 조직의 성장을 돕습니다."
vision: "대한민국 기업 교육의 기준이 되는 교육 파트너"

# 핵심 가치 (3~4개 권장)
values:
  - title: "현장 중심"
    description: "이론보다 현장에서 바로 쓰이는 실무 역량에 집중합니다."
  - title: "맞춤 설계"
    description: "고객사의 과제와 조직 문화에 맞춰 과정을 새로 설계합니다."
  - title: "검증된 강사진"
    description: "10년 이상의 실무 경력과 강의 경험을 갖춘 전문가가 진행합니다."
  - title: "성과 관리"
    description: "교육 전후 진단과 사후 코칭으로 학습 효과를 끝까지 책임집니다."

